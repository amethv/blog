    <main>
        
        <section id="informacion-contacto">
            <div class="titulo-pagina">
                <h1>CONTÁCTAME</h1>
            </div>

            <div class="tabla-datos-contenedor">
                <table border="1" style="border-collapse: collapse; cellpadding: 10px;">
                    <tr>
                        <td><strong>Teléfono</strong></td>
                        <td>+593 0984500149</td>

                    <tr>

                    </tr>
                </table>
            </div>
        </section>

        <hr> <section id="formulario-contacto">
            <h2>ENVÍAME UN MENSAJE</h2>

            <form action="#" method="POST" class="form-mensaje">
                
                <div class="grupo-formulario">
                    <label for="nombre">Nombre *</label>
                    <br>
                    <input type="text" id="nombre" name="nombre" required style="width: 60%; max-width: 500px;">
                </div>

                <br>

                <div class="grupo-formulario">
                    <label for="email">Email *</label>
                    <br>
                    <input type="email" id="email" name="email" required style="width: 60%; max-width: 500px;">
                </div>

                <br>

                <div class="grupo-formulario">
                    <label for="tema">Tema *</label>
                    <br>
                    <input type="text" id="tema" name="tema" required style="width: 60%; max-width: 500px;">
                </div>

                <br>

                <div class="grupo-formulario">
                    <label for="mensaje">Mensaje *</label>
                    <br>
                    <textarea id="mensaje" name="mensaje" rows="6" required style="width: 60%; max-width: 500px;"></textarea>
                </div>

                <br>

                <div class="boton-enviar-contenedor">
                    <button type="submit" class="btn-enviar">ENVIAR</button>
                </div>

            </form>
        </section>

    </main>

    <footer>
